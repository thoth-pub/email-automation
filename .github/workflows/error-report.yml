name: crossref-error-report

on:
  workflow_dispatch:

jobs:
  fetch_crossref_emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Crossref email fetch script
        env:
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: python src/generate_error_report.py

      - name: Upload error report CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossref-error-report
          path: crossref_error_report.csv

      - name: Send email to Crossref
        uses: dawidd6/action-send-mail@v3
        with:
          connection_url: ${{ secrets.THOTH_SMTP }}
          subject: Crossref submission error reports from Thoth
          to: ${{ secrets.CROSSREF_EMAIL }}
          from: Thoth Open Metadata <info@thoth.pub>
          body: Crossref errors are contained as an attached CSV
          attachments: crossref_error_report.csv
